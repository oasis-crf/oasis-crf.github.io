<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OASIS — Communiquer dans votre langue</title>
<style>
  :root{
    /* ---- Charte graphique OASIS : les 5 couleurs du logo ---- */
    --turquoise:#6DC6C2;
    --orange:#ED8F45;
    --beige:#EDCDB8;
    --olive:#9DA679;
    --jaune:#F6E56F;

    /* ---- Déclinaisons foncées ----
       Les 5 couleurs ci-dessus sont trop claires pour porter du texte :
       sur blanc elles plafonnent à 2,6 de contraste, or il en faut 4,5
       pour rester lisible. On les garde donc pour les aplats, les
       bordures et les touches de couleur, et on utilise ces versions
       foncées dès qu'il s'agit de texte ou de bouton. */
    --turquoise-f:#1F7A74;   /* 5,1 sur blanc  */
    --turquoise-ff:#17615C;  /* 7,2 sur blanc  */
    --orange-f:#A85A17;      /* 5,1 sur blanc  */
    --olive-f:#5E6544;       /* 6,1 sur blanc  */

    /* ---- Neutres ----
       Le fond de page est le beige de la charte, les cartes restent
       blanches : c'est ce qui les détache. Les traits de séparation sont
       en noir très transparent plutôt qu'en beige plus foncé, pour rester
       visibles aussi bien sur le beige que sur le blanc des cartes. */
    --ink:#2A2723; --muted:#5C564C; --bg:var(--beige); --card:#ffffff;
    --turquoise-pale:#e3f2f1; --line:rgba(42,39,35,.16); --focus:#17615C;
    --radius:16px; --shadow:0 1px 2px rgba(42,39,35,.05), 0 6px 20px rgba(42,39,35,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:0 18px 24px}

  /* ---------- header ---------- */
  header.top{
    background:#ffffff;
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  .top-in{max-width:1040px; margin:0 auto; padding:14px 18px;
    display:flex; align-items:center; flex-wrap:wrap; gap:6px 16px}
  /* Le logo est un JPEG sur fond blanc, sans transparence : l'en-tête est donc
     en blanc franc, pour que ce fond ne se voie pas. Ne pas y mettre de teinte
     ni de dégradé, un liseré blanc apparaîtrait autour du logo. */
  .brand{margin:0; line-height:0; flex:0 0 auto}
  .brand img{height:46px; width:auto; display:block}
  .tagline{margin:0; color:var(--muted); font-size:.86rem}
  /* Le logo Croix-Rouge remplace le mot : il est sur fond blanc comme
     l'en-tête, donc il s'y fond sans détourage. */
  .tagline img{height:28px; width:auto; vertical-align:middle; margin-right:1px}

  /* ---------- search ---------- */
  .search{margin:22px 0 8px; position:relative}
  .search input{
    width:100%; font-size:1.05rem; padding:15px 16px 15px 46px; border-radius:14px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  }
  .search input:focus{outline:3px solid var(--turquoise-pale); border-color:var(--turquoise-f)}
  .search .ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted)}
  .count{color:var(--muted); font-size:.82rem; margin:6px 2px 0}

  /* ---------- grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:14px}
  .tile{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 14px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:9px; min-height:112px; transition:transform .12s, border-color .12s, box-shadow .12s;
  }
  .tile:hover{transform:translateY(-2px); border-color:var(--turquoise-f); box-shadow:0 8px 26px rgba(31,122,116,.16)}
  .tile:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  .flags{display:flex; gap:5px; flex-wrap:wrap; min-height:16px}
  /* Les drapeaux n'ont pas tous les mêmes proportions (le Royaume-Uni et le
     Soudan sont en 2:1, le Niger presque carré…). On fixe donc la hauteur et on
     laisse la largeur s'adapter : chaque drapeau garde ses proportions et n'est
     jamais rogné. max-width protège d'un format extrême, contain évite alors
     toute déformation. */
  .flags img{height:16px; width:auto; max-width:36px; object-fit:contain;
    border-radius:3px; box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .native{font-size:1.22rem; font-weight:700; line-height:1.25}
  .fr{font-size:.82rem; color:var(--muted); margin-top:auto}

  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0}

  /* ---------- detail ---------- */
  #detail{display:none}
  .back{
    display:inline-flex; align-items:center; gap:8px; margin:22px 0 4px; padding:10px 14px;
    border-radius:12px; border:1px solid var(--line); background:var(--card);
    font-size:.95rem; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  }
  .back:hover{border-color:var(--turquoise-f); color:var(--turquoise-ff)}
  .back:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  .lang-head{display:flex; align-items:center; gap:14px; margin:16px 2px 8px}
  .lang-head .flags img{height:20px; width:auto; max-width:46px}
  .lang-head .nh{font-size:1.7rem; font-weight:800; line-height:1.15}
  .lang-head .fh{color:var(--muted); font-size:.9rem}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-top:14px; box-shadow:var(--shadow);
  }
  /* « PHRASE 1 » : le vert de la charte, dans sa version foncée — tel quel
     (#9DA679) il n'est qu'à 2,6 de contraste, illisible en si petit. */
  .eyebrow{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--olive-f); font-weight:700}
  .src{color:var(--muted); font-size:.92rem; margin:6px 0 12px}
  .target{font-size:1.5rem; line-height:1.45; font-weight:600}
  .target.rtl{direction:rtl; text-align:right}
  .todo{font-size:1.02rem; color:var(--muted); font-style:italic}

  .play{
    margin-top:16px; display:inline-flex; align-items:center; gap:10px; cursor:pointer;
    background:var(--turquoise-f); color:#fff; border:0; border-radius:12px; padding:13px 20px;
    font-size:1.02rem; font-weight:600;
  }
  .play:hover{background:var(--turquoise-ff)}
  .play:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  .play.playing{background:var(--turquoise-ff)}
  .play[disabled]{background:var(--beige); color:var(--muted); cursor:default}
  .noaudio{margin-top:14px; color:var(--muted); font-size:.88rem}
  .aerr{margin-top:10px; color:var(--orange-f); font-size:.86rem}

  /* ---------- states ---------- */
  .msg{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; margin-top:26px; box-shadow:var(--shadow)}
  .msg h2{margin:0 0 8px; font-size:1.1rem}
  .msg code{background:#f6ece1; padding:2px 7px; border-radius:6px; font-size:.9em}
  .spin{width:26px;height:26px;border:3px solid var(--turquoise-pale);border-top-color:var(--turquoise-f);
    border-radius:50%; animation:sp .8s linear infinite; margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- footer ---------- */
  footer.foot{
    max-width:1040px; margin:0 auto; padding:22px 18px 40px; color:var(--muted); font-size:.8rem;
    border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center;
  }
  footer.foot a{color:var(--turquoise-ff)}
  .warn{color:#7a4a10; background:#fdf1e2; border:1px solid #efd3b4;
    border-radius:10px; padding:8px 12px; margin-top:12px; font-size:.85rem}

  @media (max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(44%,1fr))}
    .target{font-size:1.32rem}
    .lang-head .nh{font-size:1.4rem}
    .brand img{height:38px}
    .tagline{font-size:.8rem}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand"><img src="logo.png" alt="L'OASIS" width="533" height="117"></h1>
    <p class="tagline"><img src="logo-crf.png" alt="Croix-Rouge française"
      width="120" height="120"> · Choisissez une langue pour communiquer</p>
  </div>
</header>

<div class="wrap">

  <!-- ========== ACCUEIL : choix de la langue ========== -->
  <section id="home">
    <div class="search">
      <span class="ic" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <input id="q" type="search" autocomplete="off" placeholder="Chercher une langue (français ou nom local)…"
             aria-label="Chercher une langue">
    </div>
    <p class="count" id="count"></p>
    <div id="notice"></div>
    <div id="grid" class="grid">
      <div class="spin" role="status" aria-label="Chargement"></div>
    </div>
  </section>

  <!-- ========== DÉTAIL : phrases d'une langue ========== -->
  <section id="detail">
    <button class="back" id="back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Toutes les langues
    </button>
    <div class="lang-head" id="langHead"></div>
    <div id="cards"></div>
  </section>

</div>

<footer class="foot">
  <span>OASIS - Croix-Rouge française</span>
  <span id="srcInfo"></span>
</footer>

<script>
/* =======================================================================
   RÉGLAGES — la seule partie à modifier si la base de données déménage.
   ======================================================================= */
var CONFIG = {
  /* Identifiant du Google Sheet partagé (voir README, section « Google Drive »).
     C'est la longue suite de caractères dans l'adresse du tableur, entre
     /d/ et /edit :
       docs.google.com/spreadsheets/d/[----- IDENTIFIANT -----]/edit
     Laisser vide ("") pour utiliser le fichier local data_traduction.xlsx à la place. */
  SHEET_ID: "",

  /* Noms des deux onglets dans le tableur (à laisser tels quels normalement) */
  SHEET_TRADUCTIONS: "Traductions",
  SHEET_PHRASES:     "Phrases",

  /* Fichier de secours, utilisé si le Google Sheet est vide ou injoignable */
  FALLBACK_XLSX: "data_traduction.xlsx"
};
/* ===================================================================== */
</script>

<script>
(function(){
  "use strict";
  var PHRASE_IDS = ["p1","p2","p3","p4","p5","p6"];
  var LANGS = [], PHRASES = {};
  var audio = new Audio();
  var playingBtn = null;

  var $ = function(s){ return document.querySelector(s); };
  var grid=$("#grid"), homeEl=$("#home"), detEl=$("#detail"), noticeEl=$("#notice"),
      qEl=$("#q"), countEl=$("#count"), cardsEl=$("#cards"), headEl=$("#langHead"),
      srcEl=$("#srcInfo");

  /* Comparaison à la française : les accents ne changent pas le classement. */
  var collator = (typeof Intl !== "undefined" && Intl.Collator)
    ? new Intl.Collator("fr", {sensitivity:"base", numeric:true})
    : { compare: function(a,b){ return a.localeCompare(b, "fr"); } };

  function norm(s){ return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,""); }

  function esc(s){ return (s||"").toString()
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;"); }

  /* ---------- drapeaux : dossier local, CDN en secours ---------- */
  /* Le secours en ligne ne vaut que pour les codes pays ISO à 2 lettres. Les
     drapeaux sans pays (« kurd », « tibet ») n'existent sur aucun CDN : ils
     sont forcément dans flags/, et s'ils manquent on n'affiche rien. */
  window.flagFallback = function(img){
    var cc = img.getAttribute("data-cc");
    if(img.getAttribute("data-tried") || cc.length !== 2){
      img.style.display = "none"; return;
    }
    img.setAttribute("data-tried","1");
    img.src = "https://flagcdn.com/w160/" + cc + ".png";
  };
  function flagsHTML(codes){
    if(!codes) return "";
    return codes.toString().split(",").map(function(c){
      c = c.trim().toLowerCase();
      if(!/^[a-z]{2,8}$/.test(c)) return "";
      return '<img loading="lazy" alt="" src="flags/'+c+'.png" data-cc="'+c+'" '+
             'onerror="flagFallback(this)">';
    }).join("");
  }

  /* ---------- lecture CSV (Google Sheets) ---------- */
  /* Gère les guillemets, les virgules et les retours à la ligne dans une cellule. */
  function parseCSV(text){
    var rows=[], row=[], cur="", inQ=false, i=0;
    text = text.replace(/^﻿/, "");
    while(i < text.length){
      var ch = text[i];
      if(inQ){
        if(ch === '"'){
          if(text[i+1] === '"'){ cur += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        cur += ch; i++; continue;
      }
      if(ch === '"'){ inQ = true; i++; continue; }
      if(ch === ','){ row.push(cur); cur=""; i++; continue; }
      if(ch === '\r'){ i++; continue; }
      if(ch === '\n'){ row.push(cur); rows.push(row); row=[]; cur=""; i++; continue; }
      cur += ch; i++;
    }
    if(cur.length || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  /* Transforme [[en-têtes],[ligne],…] en [{colonne: valeur}, …] */
  function toObjects(rows){
    if(!rows.length) return [];
    var head = rows[0].map(function(h){ return (h||"").trim(); });
    return rows.slice(1).map(function(r){
      var o = {};
      head.forEach(function(h, i){ if(h) o[h] = (r[i] || "").trim(); });
      return o;
    }).filter(function(o){
      return Object.keys(o).some(function(k){ return o[k]; }); // ignore lignes vides
    });
  }

  function sheetURL(name){
    return "https://docs.google.com/spreadsheets/d/" + CONFIG.SHEET_ID +
           "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(name);
  }

  function fetchCSV(name){
    return fetch(sheetURL(name), {cache:"no-store"}).then(function(res){
      if(!res.ok) throw new Error("Google Sheets a répondu HTTP " + res.status);
      return res.text();
    }).then(function(txt){
      /* Si le tableur n'est pas partagé publiquement, Google renvoie une page
         HTML de connexion au lieu du CSV : on le détecte ici. */
      if(/^\s*</.test(txt)) throw new Error("le tableur n'est pas partagé publiquement");
      return toObjects(parseCSV(txt));
    });
  }

  /* ---------- lecture du fichier Excel local (secours) ---------- */
  function loadScript(src){
    return new Promise(function(ok, ko){
      var s = document.createElement("script");
      s.src = src; s.onload = ok;
      s.onerror = function(){ ko(new Error("bibliothèque de lecture Excel indisponible")); };
      document.head.appendChild(s);
    });
  }

  function fetchXLSX(){
    return loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js")
      .then(function(){ return fetch(CONFIG.FALLBACK_XLSX, {cache:"no-store"}); })
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        return res.arrayBuffer();
      })
      .then(function(buf){
        var wb = XLSX.read(new Uint8Array(buf), {type:"array"});
        return {
          trad:    XLSX.utils.sheet_to_json(wb.Sheets[CONFIG.SHEET_TRADUCTIONS], {defval:""}),
          phrases: XLSX.utils.sheet_to_json(wb.Sheets[CONFIG.SHEET_PHRASES],     {defval:""})
        };
      });
  }

  /* ---------- chargement ---------- */
  /* Les en-têtes du tableur peuvent s'écrire « Code » ou « code » : on ramène
     tout en minuscules, pour qu'une majuscule ajoutée dans le tableur ne casse
     jamais l'affichage. */
  function clesEnMinuscules(rows){
    return rows.map(function(row){
      var o = {};
      Object.keys(row).forEach(function(k){ o[k.trim().toLowerCase()] = row[k]; });
      return o;
    });
  }

  function ingest(trad, phrases){
    trad    = clesEnMinuscules(trad);
    phrases = clesEnMinuscules(phrases);
    phrases.forEach(function(row){
      var id = (row.id || "").toString().trim();
      if(!id) return;
      var keys = Object.keys(row);
      PHRASES[id] = row[keys[1]] || "";   // 2e colonne = le texte français
    });
    LANGS = trad.filter(function(r){ return (r.code || "").toString().trim(); });
    /* Ordre alphabétique français : « Éwé » se range à E, « Hébreu » à H.
       L'ordre des lignes du tableur n'a donc plus d'importance. */
    LANGS.sort(function(a, b){
      return collator.compare((a.langue_fr||"").toString(), (b.langue_fr||"").toString());
    });
  }

  function boot(){
    if(CONFIG.SHEET_ID){
      Promise.all([fetchCSV(CONFIG.SHEET_TRADUCTIONS), fetchCSV(CONFIG.SHEET_PHRASES)])
        .then(function(res){
          ingest(res[0], res[1]);
          if(!LANGS.length) throw new Error("aucune langue trouvée dans le tableur");
          srcEl.innerHTML = '· Données : <a href="https://docs.google.com/spreadsheets/d/'+
            esc(CONFIG.SHEET_ID)+'/edit" target="_blank" rel="noopener">Google Sheets</a> ' +
            '<span style="opacity:.7">(modifiable par les bénévoles)</span>';
          renderGrid("");
        })
        .catch(function(err){
          /* Le tableur est injoignable → on repart sur la copie locale. */
          bootLocal('Le tableur en ligne n’a pas pu être lu (' + esc(err.message||err) +
                    '). Affichage de la dernière copie enregistrée dans le site.');
        });
    } else {
      bootLocal("");
    }
  }

  function bootLocal(warning){
    fetchXLSX().then(function(d){
      ingest(d.trad, d.phrases);
      if(warning) noticeEl.innerHTML = '<p class="warn">⚠️ ' + warning + '</p>';
      renderGrid("");
    }).catch(function(err){ showError(err); });
  }

  function showError(err){
    var local = location.protocol === "file:";
    grid.innerHTML =
      '<div class="msg" style="grid-column:1/-1">'+
      '<h2>Impossible de charger les données ('+esc(err&&err.message||err)+')</h2>'+
      (local
        ? '<p>La page a été ouverte directement (<code>file://</code>). Pour lire le fichier Excel, '+
          'lancez un petit serveur local depuis le dossier du projet :</p>'+
          '<p><code>python -m http.server 8000</code></p>'+
          '<p>puis ouvrez <code>http://localhost:8000</code>. Une fois en ligne (GitHub Pages…), '+
          'tout fonctionne sans cette étape.</p>'
        : '<p>Vérifiez que le fichier <code>data_traduction.xlsx</code> se trouve bien à côté de '+
          '<code>index.html</code>, ou que le Google Sheet est bien partagé en lecture '+
          '« Tous les utilisateurs disposant du lien ».</p>')+
      '</div>';
    countEl.textContent = "";
  }

  /* ---------- grille ---------- */
  function renderGrid(query){
    var nq = norm(query);
    var list = LANGS.filter(function(l){
      return !nq || norm(l.langue_fr).indexOf(nq)>-1 || norm(l.langue_native).indexOf(nq)>-1;
    });
    countEl.textContent = list.length + (list.length>1 ? " langues" : " langue");
    if(!list.length){
      grid.innerHTML = '<p class="empty">Aucune langue ne correspond à « '+
        esc(query||"")+' ».</p>';
      return;
    }
    grid.innerHTML = list.map(function(l){
      return '<button class="tile" data-code="'+esc(l.code)+'">'+
        '<span class="flags">'+flagsHTML(l.drapeaux)+'</span>'+
        '<span class="native"'+(l.sens==="rtl"?' dir="rtl"':'')+'>'+esc(l.langue_native)+'</span>'+
        '<span class="fr">'+esc(l.langue_fr)+'</span>'+
      '</button>';
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".tile"), function(b){
      b.addEventListener("click", function(){ openLang(b.getAttribute("data-code")); });
    });
  }

  /* ---------- détail d'une langue ---------- */
  function openLang(code){
    stopAudio();
    var l = LANGS.find(function(x){ return x.code===code; });
    if(!l) return;
    var rtl = l.sens==="rtl";
    headEl.innerHTML =
      '<span class="flags">'+flagsHTML(l.drapeaux)+'</span>'+
      '<div><div class="nh"'+(rtl?' dir="rtl"':'')+'>'+esc(l.langue_native)+'</div>'+
      '<div class="fh">'+esc(l.langue_fr)+'</div></div>';

    cardsEl.innerHTML = PHRASE_IDS.map(function(pid, i){
      var target = (l[pid]||"").toString().trim();
      var apath  = (l["audio"+(i+1)]||"").toString().trim();
      var body;
      if(target){
        body = '<div class="target'+(rtl?' rtl':'')+'">'+esc(target)+'</div>';
      } else {
        body = '<div class="todo">Traduction à ajouter</div>';
      }
      /* L'audio s'affiche dès qu'il existe, même sans traduction écrite : la
         personne entend la phrase dans sa langue, c'est le plus important. */
      var ctrl;
      if(apath){
        ctrl = '<button class="play" data-src="'+esc(audioURL(apath))+'">'+
               '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'+
               '<span class="lbl">Écouter</span></button>';
      } else if(target){
        ctrl = '<div class="noaudio">🎙️ Audio à enregistrer</div>';
      } else {
        ctrl = '';
      }
      return '<div class="card">'+
        '<div class="eyebrow">Phrase '+(i+1)+'</div>'+
        '<div class="src">'+esc(PHRASES[pid]||"")+'</div>'+
        body + ctrl +
      '</div>';
    }).join("");

    Array.prototype.forEach.call(cardsEl.querySelectorAll(".play"), function(btn){
      btn.addEventListener("click", function(){ toggleAudio(btn); });
    });

    homeEl.style.display="none"; detEl.style.display="block";
    window.scrollTo(0,0);
    $("#back").focus();
  }

  /* ---------- audio ---------- */
  /* Un lien de partage Google Drive collé tel quel ne se lit pas dans une page
     web : on le convertit en lien de téléchargement direct. Ça dépanne, mais le
     dossier audio/ du site reste plus fiable (voir README). */
  function audioURL(p){
    var m = p.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"]*?id=)([-\w]{20,})/);
    return m ? "https://drive.google.com/uc?export=download&id=" + m[1] : p;
  }
  function setBtn(btn, playing){
    var lbl = btn.querySelector(".lbl");
    btn.classList.toggle("playing", playing);
    if(lbl) lbl.textContent = playing ? "Pause" : "Écouter";
  }
  function stopAudio(){
    audio.pause();
    if(playingBtn){ setBtn(playingBtn,false); playingBtn=null; }
  }
  function toggleAudio(btn){
    var src = btn.getAttribute("data-src");
    var old = btn.parentNode.querySelector(".aerr"); if(old) old.remove();
    if(playingBtn===btn && !audio.paused){ stopAudio(); return; }
    stopAudio();
    audio.src = src;
    audio.play().then(function(){
      playingBtn=btn; setBtn(btn,true);
    }).catch(function(){
      var e=document.createElement("div"); e.className="aerr";
      e.textContent="Audio indisponible (fichier "+src+" introuvable ou illisible).";
      btn.insertAdjacentElement("afterend", e);
    });
  }
  audio.addEventListener("ended", stopAudio);

  /* ---------- navigation ---------- */
  $("#back").addEventListener("click", function(){
    stopAudio();
    detEl.style.display="none"; homeEl.style.display="block";
    qEl.focus();
  });
  qEl.addEventListener("input", function(){ renderGrid(qEl.value); });

  boot();
})();
</script>
</body>
</html>
